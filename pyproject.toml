[project]
name = "rekordbox-playlist-converter"
version = "0.2.0"
description = "Convert Rekordbox playlists with automatic format selection for Pioneer DJ / AlphaTheta CDJ/XDJ equipment"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "biscoito", email = "eu@biscoito.eu"}
]
license = {text = "GPL-3.0-or-later"}
keywords = ["rekordbox", "cdj", "xdj", "pioneer-dj", "playlist", "converter", "mp3", "flac", "music"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Multimedia :: Sound/Audio :: Conversion",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "rich>=14.2.0",
    "typer>=0.20.0",
]

[project.scripts]
# Entry point lives in cli.py; main.py remains as a thin shim so the dev
# workflow `python main.py ...` continues to work as documented.
rekordbox-converter = "cli:app"

[project.urls]
Homepage = "https://github.com/b1scoito/rekordbox-playlist-converter"
Repository = "https://github.com/b1scoito/rekordbox-playlist-converter"
Issues = "https://github.com/b1scoito/rekordbox-playlist-converter/issues"

[dependency-groups]
dev = [
    "pre-commit>=4.3.0",
    "pyright>=1.1.407",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# --strict-markers makes typo'd @pytest.mark.xxx fail instead of silently
# becoming dead code; --strict-config does the same for ini options.
addopts = "-v --tb=short --strict-markers --strict-config"

[tool.coverage.run]
source = ["_console", "models", "quality", "converter", "cli", "main"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, N pep8-naming, UP pyupgrade,
# B flake8-bugbear (common bug patterns), SIM flake8-simplify (clarity),
# RUF ruff-specific rules. The baseline catches real bugs (mutable
# default args, unused-but-assigned vars) without being noisy.
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.pyright]
# strict surfaces missing/implicit-Any annotations across the whole tree.
# The codebase was already mostly typed; production code is clean under
# strict mode. Tests are relaxed below because the patterns that trip
# strict (accessing private methods, untyped MagicMock returns, untyped
# parametrize fixtures) are legitimate for test code.
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
pythonVersion = "3.11"

[[tool.pyright.executionEnvironments]]
root = "tests"
# Tests need the repo root on path to import flat modules (converter,
# quality, models, ...). pytest already does this at runtime.
extraPaths = ["."]
# Tests are allowed to: reach into private members of the SUT, omit
# parameter annotations on test methods / fixtures, and accept the
# MagicMock-typed values that subprocess patches return.
reportPrivateUsage = "none"
reportMissingParameterType = "none"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
