name: CI

# Triggers on the branches this repo actually uses. The previous config
# targeted master/main only, so PRs to dev produced no CI runs.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras

      # Scope every check at `.` so the modular split (quality.py, models.py,
      # converter.py, cli.py, _console.py, main.py) is actually checked. The
      # prior commands targeted only `main.py tests/` and silently skipped
      # everything else after the file got split.
      - name: Run ruff linter
        run: uv run ruff check .

      - name: Run ruff formatter
        run: uv run ruff format --check .

      - name: Run pyright type checker
        run: uv run pyright .

      - name: Run tests with coverage
        # Coverage sources come from pyproject [tool.coverage.run]; we just
        # ask pytest-cov to honour them and emit XML for Codecov.
        run: uv run pytest tests/ --cov --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
