# Pre-commit hooks for rekordbox-playlist-converter
# Install: pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      # Run the linter (auto-fix safe issues)
      - id: ruff
        args: [--fix]
      # Run the formatter
      - id: ruff-format

  # Pyright as a local hook so it shares the project's uv-managed venv and
  # honours pyproject.toml's [tool.pyright] config. Without this, type
  # errors only surface in CI -- and CI itself was broken until recently.
  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
        require_serial: true
